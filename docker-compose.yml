# Local environment: SQL Server 2022 + the MCP server.
# 1. Copy .env.example to .env and set the passwords.
# 2. Download AdventureWorksLT2022.bak into db/backup/ (see README).
# 3. docker compose up -d sqlserver, then run db/restore-adventureworkslt.sql
#    and db/create-readonly-user.sql (section A).
# 4. docker compose up -d --build mcp-server

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./db/backup:/var/opt/mssql/backup:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -d AdventureWorksLT -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp-server:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Sql: "Server=sqlserver,1433;Database=AdventureWorksLT;User ID=mcp_reader;Password=${MCP_READER_PASSWORD:?Set MCP_READER_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
      ApiKey__Key: ${MCP_API_KEY:?Set MCP_API_KEY in .env}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sqldata:
